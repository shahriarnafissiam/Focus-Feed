<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <title>Focus Feed</title>
  <style>
    body {
      width: 290px;
      margin: 0;
      padding: 14px;
      font-family: Arial, sans-serif;
      background-color: #111827;
      color: #f9fafb;
    }
    h3 {
      margin: 0 0 10px 0;
      font-size: 16px;
      color: #38bdf8;
    }
    .card {
      background: #1f2937;
      border: 1px solid #374151;
      border-radius: 8px;
      padding: 11px;
      margin-bottom: 10px;
    }
    .card:last-of-type {
      margin-bottom: 0;
    }
    .row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      font-weight: bold;
    }
    .divider {
      height: 1px;
      background: #374151;
      margin: 10px 0;
    }
    .subtext {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 3px;
    }
    select, input[type="number"] {
      padding: 7px 9px;
      border-radius: 6px;
      border: 1px solid #374151;
      background: #111827;
      color: #ffffff;
      font-size: 13px;
      outline: none;
    }
    input[type="checkbox"] {
      width: 16px;
      height: 16px;
      cursor: pointer;
    }
    .focus-controls {
      display: flex;
      gap: 6px;
      margin-top: 9px;
    }
    select {
      flex: 1;
    }
    .custom-time-row {
      display: none;
      gap: 6px;
      margin-top: 8px;
    }
    .custom-time-row input {
      flex: 1;
      min-width: 0;
    }
    .custom-time-row select {
      width: 88px;
      flex: none;
    }
    button.focus-btn {
      padding: 7px 11px;
      border: none;
      border-radius: 6px;
      background: #16a34a;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
      font-size: 12px;
    }
    button.focus-btn:hover:not(:disabled) {
      background: #15803d;
    }
    button:disabled, input:disabled, select:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .timer-banner {
      margin-top: 9px;
      padding: 7px;
      border-radius: 6px;
      background: #451a03;
      border: 1px solid #b45309;
      color: #fde68a;
      font-size: 12px;
      text-align: center;
      display: none;
    }
  </style>
</head>
<body>
  <h3>Focus Feed</h3>

  <!-- Clean Feed & Hide Stories Toggles -->
  <div class="card">
    <div class="row">
      <label for="cleanFeedToggle">Clean Feed Mode</label>
      <input type="checkbox" id="cleanFeedToggle" />
    </div>
    <div class="subtext">অন থাকলে হোম ফিড পুরোপুরি ফাঁকা থাকবে (Message ও Notification সচল)।</div>

    <div class="divider"></div>

    <div class="row">
      <label for="hideStoriesToggle">Hide Stories</label>
      <input type="checkbox" id="hideStoriesToggle" />
    </div>
    <div class="subtext">অন থাকলে হোমপেজের উপরের Stories সেকশন হাইড থাকবে।</div>
  </div>

  <!-- Focus Mode Timer & Lock -->
  <div class="card">
    <div class="row">
      <span>Focus Mode (Locked)</span>
    </div>
    <div class="subtext">চালু করলে সময় শেষ না হওয়া পর্যন্ত সব সেটিংস লক থাকবে।</div>

    <div class="focus-controls">
      <select id="focusDuration">
        <option value="25">25 মিনিট</option>
        <option value="30">30 মিনিট</option>
        <option value="60">60 মিনিট (1 ঘণ্টা)</option>
        <option value="120">2 ঘণ্টা</option>
        <option value="180">3 ঘণ্টা</option>
        <option value="custom">Custom Time...</option>
      </select>
      <button class="focus-btn" id="startFocusBtn">Start Focus</button>
    </div>

    <div class="custom-time-row" id="customTimeRow">
      <input type="number" id="customTimeValue" min="1" placeholder="সময় লিখুন (যেমন: 45)" />
      <select id="customTimeUnit">
        <option value="minutes">মিনিট</option>
        <option value="hours">ঘণ্টা</option>
      </select>
    </div>

    <div class="timer-banner" id="timerBanner">
      ফোকাস লক চালু আছে • বাকি সময়: <strong id="remainingTime">--:--</strong>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
